name: Backtest (phase 3)

on:
  workflow_dispatch: # run by hand from the Actions tab
    inputs:
      seasons:
        description: "Seasons to test"
        default: "20232024,20242025,20252026"

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node atlantic/backtest.mjs
        env:
          SEASONS: ${{ inputs.seasons }}
      - name: Save the report to the repo
        run: |
          git config user.name "season-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          git diff --cached --quiet || (git commit -m "Backtest report $(date +%F)" && git pull --rebase && git push)

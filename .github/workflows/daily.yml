name: Season at a glance

on:
  schedule:
    # GitHub cron is UTC only, so schedule both 6am EDT (10:00 UTC) and
    # 6am EST (11:00 UTC); the gate job below lets only the right one run.
    - cron: "0 10 * * *"
    - cron: "0 11 * * *"
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions:
  contents: write # lets the workflow save the daily image to the repo

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          offset=$(TZ=America/Toronto date +%z) # -0400 in summer, -0500 in winter
          go=false
          if [ -z "$SCHEDULE" ]; then go=true; fi # manual run
          if [ "$SCHEDULE" = "0 10 * * *" ] && [ "$offset" = "-0400" ]; then go=true; fi
          if [ "$SCHEDULE" = "0 11 * * *" ] && [ "$offset" = "-0500" ]; then go=true; fi
          echo "go=$go" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: node build.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: season-at-a-glance
          path: dist/
      - name: Save today's image (this also makes Netlify refresh)
        run: |
          mkdir -p latest
          cp dist/season-at-a-glance.png latest/
          git config user.name "season-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest/season-at-a-glance.png
          git diff --cached --quiet || (git commit -m "Daily image $(date +%F)" && git push)
      - name: Post to Reddit
        if: ${{ vars.AUTO_POST == 'true' }}
        run: node post-to-reddit.mjs
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
          REDDIT_PASSWORD: ${{ secrets.REDDIT_PASSWORD }}
          SUBREDDIT: ${{ vars.SUBREDDIT || 'OttawaSenators' }}
          FLAIR_ID: ${{ vars.FLAIR_ID }}
          ONLY_AFTER_GAMES: ${{ vars.ONLY_AFTER_GAMES || 'true' }}
